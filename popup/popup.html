<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AndItsGone</title>
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --fg: #1f2330; --muted: #6a7084; --line: #d5d8e2;
  --accent: #2a5db0; --accent-fg: #ffffff; --warn: #9a5b00;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181f; --panel: #1f222b; --fg: #e8eaf1; --muted: #9399ab; --line: #343846;
          --accent: #7ea6ec; --accent-fg: #10131a; --warn: #e0a64b; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; width: 340px; background: var(--bg); color: var(--fg);
       font: 13px/1.4 "Lucida Grande", "Segoe UI", system-ui, sans-serif; }
header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { margin: 0; font: 700 17px/1.2 Georgia, serif; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
.site { display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.site .host { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.site .host small { display: block; font-weight: 400; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 6px 0; }
li label { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 16px; cursor: pointer; }
li label:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.name { font-weight: 700; }
.desc { color: var(--muted); font-size: 12px; grid-column: 1; }
input[type=checkbox] { grid-row: 1 / span 2; grid-column: 2; align-self: center;
  width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
footer { padding: 10px 16px 14px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
#reload { font: inherit; font-weight: 700; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--accent);
          background: var(--accent); color: var(--accent-fg); cursor: pointer; }
#reload[hidden] { display: none; }
.hint { color: var(--muted); font-size: 12px; }
.paused .hint { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header><h1>AndIts<span>Gone</span></h1></header>
<div class="site" id="siteRow">
  <div class="host" id="host">This site<small id="siteState">Cleaned up</small></div>
  <label><input type="checkbox" id="pause"> Pause here</label>
</div>
<ul id="list"></ul>
<footer>
  <span class="hint" id="hint">Changes apply right away. The page reloads to pick them up.</span>
</footer>
<script src="../shared/defaults.js"></script>
<script src="popup.js"></script>
</body>
</html>
